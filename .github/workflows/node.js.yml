name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all JS
        run: |
          set -euo pipefail
          found=0
          for f in *.js; do
            echo "check $f"
            node --check "$f"
            found=$((found + 1))
          done
          test "$found" -gt 0

      - name: Required files
        run: |
          test -f index.html
          test -f ui.html
          test -f vercel.json
