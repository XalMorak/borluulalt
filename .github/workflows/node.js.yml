name: Static site check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check JS
        run: |
          node --check app.js
          node --check app2.js
          node --check app3.js
          echo "All JS files OK"
