<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ажилтны борлуулалтын хуудас</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460);min-height:100vh;color:#333;padding:12px}.container{max-width:1100px;margin:0 auto}.card{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:20px;margin-bottom:16px}h1{font-size:1.4rem;text-align:center;color:#1a1a2e;margin-bottom:12px}.login-box{max-width:400px;margin:48px auto;text-align:center}.login-box input{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:8px;margin:8px 0;text-align:center}.btn{background:#0f3460;color:#fff;border:none;padding:10px 20px;font-size:.95rem;border-radius:8px;cursor:pointer;margin:4px}.btn-success{background:#27ae60}.btn-secondary{background:#7f8c8d}.btn-outline{background:#fff;color:#0f3460;border:2px solid #0f3460}.btn-sm{padding:5px 12px;font-size:.8rem}.btn-danger{background:#c0392b}.header-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;font-size:.9rem}.header-info label{font-weight:600;color:#555;display:block}.header-info input,.header-info select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:3px;font-size:16px}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem}th,td{border:1px solid #ddd;padding:6px 4px;text-align:center}th{background:#0f3460;color:#fff}tr:nth-child(even){background:#f8f9fa}input[type=number]{width:72px;padding:5px;border:1px solid #ccc;border-radius:4px;text-align:center;font-size:16px}.footer-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.footer-fields label{font-weight:600;display:block;margin-bottom:3px;color:#555;font-size:.85rem}.footer-fields input{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px}.role-badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:.75rem;font-weight:600;margin-left:6px}.role-emp{background:#3498db;color:#fff}.role-sup{background:#e74c3c;color:#fff}.user-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}.summary-box{background:#f0f7ff;border-left:5px solid #0f3460;border-radius:10px;padding:14px;margin-top:16px}.summary-item{display:inline-block;margin:6px 12px 6px 0;min-width:90px}.summary-item .label{font-size:.75rem;color:#666}.summary-item .value{font-size:1.15rem;font-weight:700}.alert{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:.9rem}.alert-success{background:#d4edda;color:#155724}.alert-error{background:#f8d7da;color:#721c24}.hidden{display:none!important}.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.tab-btn{padding:8px 12px;font-size:.8rem;border:1px solid #ccc;background:#f5f5f5;border-radius:8px;cursor:pointer}.tab-btn.active{background:#0f3460;color:#fff;border-color:#0f3460}.sub-item{padding:10px;border:1px solid #eee;border-radius:8px;margin:6px 0;cursor:pointer}.stock-low{color:#c0392b;font-weight:700}.stock-ok{color:#27ae60}.recon-box{background:#f8fbff;border:2px solid #0f3460;border-radius:10px;padding:14px;margin-top:16px}.recon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.recon-item{background:#fff;padding:10px;border-radius:8px;text-align:center}.recon-item .label{font-size:.75rem;color:#666}.recon-item .value{font-size:1.1rem;font-weight:700}.diff-ok{color:#27ae60}.diff-over{color:#2980b9}.diff-short{color:#c0392b}.sync-badge{font-size:.75rem;padding:3px 8px;border-radius:12px;margin-left:6px}.sync-badge.ok{background:#d4edda;color:#155724}.sync-badge.err{background:#f8d7da;color:#721c24}.sync-badge.busy{background:#fff3cd;color:#856404}.table-wrap{overflow-x:auto;width:100%}@media(max-width:700px){body{padding:6px}.card{padding:12px}.user-bar{position:sticky;top:0;z-index:20;background:#fff}.header-info{grid-template-columns:1fr 1fr}table{min-width:480px;font-size:.78rem}input[type=number]{width:58px;font-size:16px}.btn{min-height:44px}}
body.dark{background:linear-gradient(135deg,#0d0d12,#12121a 50%,#1a1a2e);color:#e8e8e8}
body.dark .card{background:#1e1e2a;color:#e8e8e8}
body.dark input,body.dark select{background:#2a2a3a;color:#eee;border-color:#444}
body.dark table th{background:#2d4a6f}
body.dark tr:nth-child(even){background:#252532}
body.dark .tab-btn{background:#2a2a3a;color:#ccc;border-color:#444}
body.dark .tab-btn.active{background:#4a90d9;color:#fff}
body.dark .btn-outline{background:#1e1e2a;color:#8ab4f8;border-color:#8ab4f8}
.chart-wrap{margin:16px 0;padding:12px;background:rgba(15,52,96,.08);border-radius:10px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:160px;overflow-x:auto}
.chart-bar-col{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart-bar{width:100%;max-width:36px;border-radius:4px 4px 0 0;min-height:2px}
.chart-bar.income{background:#27ae60}.chart-bar.over{background:#2980b9}.chart-bar.short{background:#c0392b}
.period-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body>
<div class="container">
<div id="loginSection" class="card login-box">
  <h1>🍺 Ажилтны борлуулалтын хуудас</h1>
  <p style="color:#666;margin:10px 0 16px;font-size:.9rem">ID-аар нэвтэрнэ (PIN байвал оруулна)</p>
  <input type="text" id="loginId" placeholder="ID" autofocus>
  <input type="password" id="loginPin" placeholder="PIN (байвал)" inputmode="numeric">
  <br>
  <button class="btn" onclick="doLogin()">Нэвтрэх</button>
  <div id="loginAlert"></div>
</div>
<div id="appSection" class="hidden">
<div class="card">
  <div class="user-bar no-print">
    <div><strong id="userNameDisplay"></strong><span id="syncBadge" class="sync-badge off"></span><span id="roleBadge" class="role-badge"></span></div>
    <div>
      <button class="btn btn-outline btn-sm" onclick="toggleDark()" id="darkBtn">🌙</button>
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">Excel</button>
      <button class="btn btn-outline btn-sm" onclick="refreshData()">Мэдээлэл шинэчлэх</button>
      <button class="btn btn-secondary btn-sm" onclick="doLogout()">Гарах</button>
    </div>
  </div>
  <div id="employeeView" class="hidden">
    <div class="header-info">
      <div><label>Огноо</label><input type="date" id="formDate"></div>
      <div><label>Ажилтан</label><input type="text" id="empName" readonly></div>
      <div><label>Байршил</label>
        <select id="locationName" onchange="onLocationChange()">
          <option value="">— Сонгох —</option>
          <option value="Оюут бар">Оюут бар</option>
          <option value="Манлай бар">Манлай бар</option>
          <option value="VIP">VIP</option>
          <option value="POWER">POWER</option>
        </select>
      </div>
      <div><label>Ээлж</label><select id="shiftType"><option>Өглөө</option><option>Орой</option><option>Бүтэн</option></select></div>
      <div><label>Шалгагч</label><input type="text" id="checkerName"></div>
      <div><label>Тек номер</label>
        <select id="receiverName"><option value="">— Эхлээд байршил сонго —</option></select>
      </div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Бараа</th><th>Үнэ</th><th>Өмнөх</th><th>Дараах</th><th>Зарсан</th><th>Орлого</th></tr></thead><tbody id="salesBody"></tbody></table></div>
    <div class="footer-fields">
      <div><label>Бэлэн мөнгө</label><input type="number" id="cashAmount" value="0" oninput="updateRecon()"></div>
      <div><label>POS дугаар</label><input type="text" id="posNumber"></div>
      <div><label>Карт нийт</label><input type="number" id="cardTotal" value="0" oninput="updateRecon()"></div>
      <div><label>Эхлэл дүн (бэлэн мөнгө)</label><input type="number" id="cashBalance" value="0" oninput="updateRecon()"></div>
    </div>
    <div class="recon-box"><div class="recon-grid">
      <div class="recon-item"><div class="label">Бодсон</div><div class="value" id="reconCalcTotal">0</div></div>
      <div class="recon-item"><div class="label">Нийт борлуулалт</div><div class="value" id="reconCollected">0</div></div>
      <div class="recon-item"><div class="label">Зөрүү</div><div class="value" id="reconDiff">0</div></div>
      <div class="recon-item"><div class="label">Төлөв</div><div class="value" id="reconStatus">—</div></div>
    </div></div>
    <div style="margin-top:14px;text-align:center" class="no-print">
      <button class="btn btn-success" onclick="saveSubmission()">Хадгалах</button>
      <button class="btn btn-secondary" onclick="resetForm()">Цэвэрлэх</button>
      <button class="btn btn-outline" onclick="window.print()">Хэвлэх</button>
    </div>
    <div id="empAlert"></div>
  </div>
  <div id="supervisorView" class="hidden">
    <div class="tabs no-print">
      <button class="tab-btn active" id="tabBtnOverview" onclick="showTab('overview')">Тойм</button>
      <button class="tab-btn" id="tabBtnSubs" onclick="showTab('submissions')">Илгээлт</button>
      <button class="tab-btn" id="tabBtnReports" onclick="showTab('reports')">Тайлан</button>
      <button class="tab-btn" id="tabBtnStock" onclick="showTab('stock')">Нөөц</button>
      <button class="tab-btn" id="tabBtnPrices" onclick="showTab('prices')">Үнэ</button>
      <button class="tab-btn" id="tabBtnUsers" onclick="showTab('users')">Хэрэглэгч</button>
    </div>
    <div id="tabOverview"><div id="overallSummary" class="summary-box"></div><div id="lowStockWarn"></div>
      <table><thead><tr><th>#</th><th>Бараа</th><th>Үнэ</th><th>Нөөц</th><th>Зарсан</th><th>Орлого</th></tr></thead><tbody id="productTotalsBody"></tbody></table>
    </div>
    <div id="tabSubmissions" class="hidden"><div id="submissionsList"></div><div id="selectedSubmissionDetail" class="hidden"></div></div>
    <div id="tabReports" class="hidden">
      <div class="header-info no-print">
        <div><label>Эхлэх</label><input type="date" id="reportFrom"></div>
        <div><label>Дуусах</label><input type="date" id="reportTo"></div>
        <div><label>Ажилтан</label><select id="reportEmp"></select></div>
        <div><label>Байршил</label>
          <select id="reportLoc" onchange="onReportLocChange()">
            <option value="">Бүгд</option>
            <option value="Оюут бар">Оюут бар</option>
            <option value="Манлай бар">Манлай бар</option>
            <option value="VIP">VIP</option>
            <option value="POWER">POWER</option>
          </select>
        </div>
        <div><label>Тек</label><select id="reportTek"><option value="">Бүгд</option></select></div>
      </div>
      <div class="period-btns no-print">
        <button class="btn btn-sm" onclick="showChart(7)">7 хоног</button>
        <button class="btn btn-sm" onclick="showChart(14)">14 хоног</button>
        <button class="btn btn-sm" onclick="showChart(21)">21 хоног</button>
        <button class="btn btn-sm" onclick="showChart(28)">28 хоног</button>
        <button class="btn btn-sm" onclick="runReport()">Харуулах</button>
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">Excel</button>
        <button class="btn btn-outline btn-sm" onclick="printReport()">Хэвлэх</button>
      </div>
      <div id="chartArea" class="chart-wrap no-print"><div id="chartBars" class="chart-bars"></div><div id="chartTitle" style="font-size:.85rem;color:#666;margin-top:6px">Сүүлийн 7 хоног</div></div>
      <div id="reportSummary" class="summary-box"></div>
      <table><thead><tr><th>Огноо</th><th>Ажилтан</th><th>Ээлж</th><th>Байршил</th><th>Тек</th><th>Орлого</th><th>Зөрүү</th></tr></thead><tbody id="reportBody"></tbody></table>
    </div>
    <div id="tabStock" class="hidden">
      <div class="header-info">
        <div><label>Байршил (нөөц)</label>
          <select id="stockLocSelect" onchange="onStockLocChange()">
            <option value="Оюут бар">Оюут бар</option>
            <option value="Манлай бар">Манлай бар</option>
            <option value="POWER">POWER</option>
          </select>
        </div>
        <div><label>Нэр</label><input id="newProdName"></div>
        <div><label>Үнэ</label><input type="number" id="newProdPrice" value="0"></div>
        <div><label>Нөөц</label><input type="number" id="newProdStock" value="0"></div>
        <button class="btn btn-success btn-sm" onclick="addProduct()">Нэмэх</button>
      </div>
      <div id="stockAlert"></div>
      <div style="margin:8px 0;text-align:right">
        <button class="btn btn-success" onclick="saveAllStock()">Бүгдийг хадгалах</button>
      </div>
      <table><thead><tr><th>#</th><th>Нэр</th><th>Үнэ</th><th>Нөөц</th><th></th></tr></thead><tbody id="stockBody"></tbody></table>
    </div>
    <div id="tabPrices" class="hidden"><div id="priceAlert"></div><table><thead><tr><th>#</th><th>Бараа</th><th>Үнэ</th></tr></thead><tbody id="pricesBody"></tbody></table>
      <button class="btn btn-success btn-sm" onclick="savePrices()">Хадгалах</button></div>
    <div id="tabUsers" class="hidden">
      <div class="header-info"><div><label>ID</label><input id="newUserId"></div><div><label>Нэр</label><input id="newUserName"></div>
      <div><label>Эрх</label><select id="newUserRole"><option value="employee">Ажилтан</option><option value="supervisor">Ахлах</option></select></div>
      <button class="btn btn-success btn-sm" onclick="addUser()">Нэмэх</button></div>
      <div id="userAlert"></div><table><thead><tr><th>ID</th><th>Нэр</th><th>Эрх</th><th>PIN</th><th></th></tr></thead><tbody id="usersBody"></tbody></table>
    </div>
  </div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@ed8269ca93ef6b1cabc5175960944346e2dc7dcb/app.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@0c61763601b24819d5a5933a94f172c044046364/app2.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@0c61763601b24819d5a5933a94f172c044046364/app3.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@f1ed81d7ab3d79cba874571068f2b1ea1f69b086/merge_fix.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@3dbaefb674ad7616639b0f33fdcbefe236ea1d29/stock_fix.js"></script>
<script src="https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@c26ee5918d7fe4f934b4a0d64645acf3f90644a5/features.js"></script>
</body>
</html>
