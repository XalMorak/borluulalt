<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Борлуулалт</title>
<style>body{margin:0;font-family:system-ui;background:#1a1a2e;color:#fff;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
<div id="bootmsg">Ачаалж байна...</div>
<script>
(async function(){
  var B = 'https://cdn.jsdelivr.net/gh/XalMorak/borluulalt@';
  var COMBINE = 'https://cdn.jsdelivr.net/combine/'
    + 'gh/XalMorak/borluulalt@main/app.js,'
    + 'gh/XalMorak/borluulalt@main/app2.js,'
    + 'gh/XalMorak/borluulalt@main/app3.js,'
    + 'gh/XalMorak/borluulalt@main/merge_fix.js,'
    + 'gh/XalMorak/borluulalt@main/stock_fix.js,'
    + 'gh/XalMorak/borluulalt@main/features.js,'
    + 'gh/XalMorak/borluulalt@main/enhancements.js,'
    + 'gh/XalMorak/borluulalt@main/firebase_auth_fix.js,'
    + 'gh/XalMorak/borluulalt@main/subs_ui.js,'
    + 'gh/XalMorak/borluulalt@main/bugfix.js,'
    + 'gh/XalMorak/borluulalt@main/delete_fix.js,'
    + 'gh/XalMorak/borluulalt@main/edit_fix.js,'
    + 'gh/XalMorak/borluulalt@main/mobile_ux.js,'
    + 'gh/XalMorak/borluulalt@main/temp_save.js,'
    + 'gh/XalMorak/borluulalt@main/print_purge.js,'
    + 'gh/XalMorak/borluulalt@f45e2da0d3ebb93abe1370bc4036630bf3ac95b1/overview_date.js,'
    + 'gh/XalMorak/borluulalt@2fd42750f551a14999eef0b208fd967c6008f565/edit_select.js';
  var WINE = B + '297c5c5dacbb01908a183c6b41ba45b1631bd3d0/wine_page.js';
  var BEER = B + 'cc15768670203752ecbce9cf0eb76bbf486ed7ad/beer_prices.js';
  var WSEC = B + 'c6c5a4734a5e63b43093737a6109815075526775/wine_sections.js';
  var BUSAD = B + '2de114c89aac2f971431b17a645dfa5c49d9248e/wine_busad.js';
  var CLEAN = B + 'daa3563adca0ca71705ce06655a783a631bf0426/beer_cleanup.js';
  try {
    var html = await (await fetch(B + '5f0394ed2bf8986dd10ab8c16fc318523cdb7e23/index.html')).text();
    html = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');
    html = html.replace(/<script\b[^>]*src=[^>]*>\s*<\/script>/gi, '');
    if (html.indexOf('btnTempSave') < 0) {
      html = html.replace(
        'onclick="saveSubmission()">Хадгалах</button>',
        'onclick="saveSubmission()">Хадгалах</button>\n      <button type="button" id="btnTempSave" class="btn btn-outline" onclick="saveTempDraft()">Түр хадгалах</button>'
      );
    }
    var inject = ''
      + '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"><\/script>'
      + '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"><\/script>'
      + '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"><\/script>'
      + '<script src="' + COMBINE + '"><\/script>'
      + '<script src="' + WINE + '"><\/script>'
      + '<script src="' + BEER + '"><\/script>'
      + '<script src="' + WSEC + '"><\/script>'
      + '<script src="' + BUSAD + '"><\/script>'
      + '<script src="' + CLEAN + '"><\/script>';
    html = html.replace('</body>', inject + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('bootmsg').textContent = 'Алдаа: ' + e;
  }
})();
</script>
</body>
</html>
